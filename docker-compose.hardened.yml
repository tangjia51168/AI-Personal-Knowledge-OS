# Local staging preparation. Use only with the isolated acceptance stack.
# Public ports/TLS and private production credentials remain release gates.
services:
  postgres:
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
  redis:
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
  minio:
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  api:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=67108864,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  worker:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=67108864,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  beat:
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=16777216,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  web:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=16777216,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
