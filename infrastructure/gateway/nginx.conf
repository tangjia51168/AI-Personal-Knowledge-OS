# Local acceptance gateway. Replace certificate custody, hosts and exposure only
# after the separate production release gates have been accepted.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 10m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 10s;
    keepalive_requests 100;

    # The direct peer is the sole rate-limit identity. No real_ip directives or
    # trusted forwarding headers are configured in this loopback acceptance setup.
    limit_req_zone $binary_remote_addr zone=auth_requests:1m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_requests:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=client_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream knowledge_web {
        server web:3000;
        keepalive 8;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 580s;
    proxy_send_timeout 70s;

    server {
        listen 8080 default_server;
        server_name localhost 127.0.0.1;
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 421; }
        # A fixed origin avoids reflecting request Host, query tickets or paths.
        return 308 https://localhost:14443;
    }

    server {
        listen 8443 ssl default_server;
        server_name localhost 127.0.0.1;
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 421; }

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 5m;
        ssl_session_tickets off;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        # HSTS is intentionally absent for the disposable localhost certificate.
        limit_conn client_connections 20;

        # The root is an engineering diagnostics dashboard. The restricted
        # gateway enters the account UI instead of showing blocked probes as down.
        location = / {
            return 302 /account;
        }

        location ~ ^/(api/(system|v1)(/|$)|health(/|$)|docs(/|$)|redoc(/|$)|openapi\.json$|metrics(/|$)) {
            return 404;
        }

        location /api/account/auth/ {
            limit_req zone=auth_requests burst=5 nodelay;
            proxy_pass http://knowledge_web;
        }

        location /api/account/ {
            limit_req zone=api_requests burst=20 nodelay;
            proxy_pass http://knowledge_web;
        }

        location / {
            proxy_pass http://knowledge_web;
        }
    }
}
