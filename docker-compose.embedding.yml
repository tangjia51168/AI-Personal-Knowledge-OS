# Explicit local CPU model opt-in; no host ports and no external egress network.
services:
  embedding:
    build:
      context: .
      dockerfile: infrastructure/docker/embedding.Dockerfile
    volumes:
      - ./.cache/embedding-model/multilingual-minilm-l12-v2-quint8-avx2-e8f8c211-mean128-v1:/model:ro
    networks: [embedding_private]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 1g
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
  api:
    environment:
      LOCAL_EMBEDDING_ENDPOINT: http://embedding:8080
    networks: [default, embedding_private]
    depends_on:
      embedding: {condition: service_healthy}
networks:
  embedding_private:
    internal: true
