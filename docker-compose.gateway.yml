# Append after the base, acceptance and hardened configurations. This overlay
# exposes only a disposable TLS gateway on loopback; it is not a public release.
services:
  gateway:
    image: knowledge-os/gateway:nginx-1.30.6-local
    pull_policy: build
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "127.0.0.1:14080:8080"
      - "127.0.0.1:14443:8443"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.cache/tls-gateway/server.crt:/etc/nginx/tls/server.crt:ro
      - ./.cache/tls-gateway/server.key:/etc/nginx/tls/server.key:ro
    read_only: true
    tmpfs: ["/tmp:size=33554432,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
